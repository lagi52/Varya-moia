<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для Вари 🖤</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ТУМАННОСТИ -->
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <!-- МЛЕЧНЫЙ ПУТЬ -->
    <div class="milky-way"></div>

    <!-- ЗВЁЗДЫ -->
    <div class="stars stars-far"></div>
    <div class="stars stars-mid"></div>
    <div class="stars stars-near"></div>

    <!-- КОСМИЧЕСКАЯ ПЫЛЬ -->
    <div class="dust"></div>

    <!-- МЕРЦАНИЕ -->
    <div class="twinkle"></div>

    <!-- ЧЁРНАЯ ДЫРА -->
    <div class="black-hole" id="blackHole">
        <div class="bh-glow"></div>
        <div class="bh-disk-2"></div>
        <div class="bh-disk"></div>
        <div class="bh-core"></div>
    </div>

    <!-- КОМЕТЫ -->
    <div class="comet comet-1"></div>
    <div class="comet comet-2"></div>
    <div class="comet comet-3"></div>

    <!-- СВЕТЯЩИЕСЯ ЧАСТИЦЫ -->
    <div class="particles" id="particles"></div>

    <!-- ЦЕНТРАЛЬНЫЙ ТЕКСТ -->
    <div class="intro">
        <h1>Для Вари</h1>
        <p>Скоро здесь будет кое-что тёплое...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>

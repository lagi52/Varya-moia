<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для Вари 🖤</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ТУМАННОСТИ (РАЗНОЦВЕТНЫЕ) -->
    <div class="nebula nebula-blue"></div>
    <div class="nebula nebula-pink"></div>
    <div class="nebula nebula-teal"></div>

    <!-- МЛЕЧНЫЙ ПУТЬ -->
    <div class="milky-way"></div>

    <!-- ЗВЁЗДЫ -->
    <div class="stars stars-far"></div>
    <div class="stars stars-mid"></div>
    <div class="stars stars-near"></div>

    <!-- КОСМИЧЕСКАЯ ПЫЛЬ -->
    <div class="dust"></div>

    <!-- ЯРКИЕ ЗВЁЗДЫ (акценты) -->
    <div class="bright-stars">
        <span class="bright-star" style="top:12%; left:22%; animation-delay:0s;"></span>
        <span class="bright-star bright-star-cyan" style="top:28%; left:78%; animation-delay:1.4s;"></span>
        <span class="bright-star bright-star-pink" style="top:68%; left:15%; animation-delay:2.8s;"></span>
        <span class="bright-star" style="top:82%; left:62%; animation-delay:4.2s;"></span>
        <span class="bright-star bright-star-cyan" style="top:45%; left:88%; animation-delay:5.6s;"></span>
        <span class="bright-star bright-star-pink" style="top:55%; left:42%; animation-delay:7s;"></span>
    </div>

    <!-- КОМЕТЫ -->
    <div class="comet comet-1"></div>
    <div class="comet comet-2"></div>

    <!-- СВЕТЯЩИЕСЯ ЧАСТИЦЫ -->
    <div class="particles" id="particles"></div>

    <!-- ЦЕНТРАЛЬНЫЙ ТЕКСТ -->
    <div class="intro">
        <h1>Для Вари</h1>
        <p>Скоро здесь будет кое-что тёплое...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
